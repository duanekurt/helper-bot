[workspace]

[package]
name = "helper-bot"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "helper_bot-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.2", default-features = false }

[dependencies]
loco-rs = { workspace = true, features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
serenity = { version = "0.12.5", default-features = false, features = [
  "client",
  "gateway",
  "model",
  "rustls_backend",
  "http",
] }
anyhow = "1.0.104"
[[bin]]
name = "helper_bot-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
